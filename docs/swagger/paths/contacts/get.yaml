tags:
  - Contacts
summary: Retrieve a list of contacts
operationId: getContacts
description: Returns a list of contacts. Supports optional pagination and filtering.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
  - name: search
    in: query
    required: false
    schema:
      type: string
responses:
  "200":
    description: Contacts found
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../../components/schemas.yaml#/Contact"
  "404":
    $ref: "../../components/responses.yaml#/NotFound"
  "401":
    $ref: "../../components/responses.yaml#/Unauthorized"
