tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Adds a new contact to the system.
security:
  - bearerAuth: []
requestBody:
  description: Contact object that needs to be added
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phone:
            type: string
        required:
          - name
          - email
responses:
  "201":
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yaml#/Contact"
  "401":
    $ref: "../../components/responses.yaml#/Unauthorized"
