tags:
  - Contacts
summary: Update an existing contact
operationId: updateContact
description: Updates contact information partially.
security:
  - bearerAuth: []
parameters:
  - $ref: "../../../components/parameters.yaml#/id"
requestBody:
  description: Fields to update for the contact
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phone:
            type: string
        example:
          name: Jane Doe
          email: jane@example.com
          phone: "+46712345678"
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas.yaml#/Contact"
  "404":
    $ref: "../../../components/responses.yaml#/NotFound"
  "401":
    $ref: "../../../components/responses.yaml#/Unauthorized"
