Contact:
  type: object
  properties:
    _id:
      type: string
      example: "64a12ef3b62a1b0001234567"
    name:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
    favorite:
      type: boolean
      example: false
  required:
    - name
    - email
    - phone
