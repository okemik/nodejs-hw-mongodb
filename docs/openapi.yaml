openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    Contacts API documentation for hw7-swagger task.

tags:
  - name: Contacts
    description: Operations related to contacts

servers:
  - url: http://localhost:3000
  - url: https://your-render-app-url.onrender.com

paths:
  /contacts:
    get:
      $ref: "./swagger/paths/contacts/get.yaml"
    post:
      $ref: "./swagger/paths/contacts/post.yaml"
  /contacts/{id}:
    get:
      $ref: "./swagger/paths/contacts/{id}/get.yaml"
    patch:
      $ref: "./swagger/paths/contacts/{id}/patch.yaml"
    delete:
      $ref: "./swagger/paths/contacts/{id}/delete.yaml"

ccomponents:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "uuid"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        phone:
          type: string
          example: "+1234567890"
      required:
        - id
        - name
        - email

  parameters:
    id:
      $ref: "./swagger/components/parameters.yaml#/id"

  responses:
    NotFound:
      $ref: "./swagger/components/responses.yaml#/NotFound"
    Unauthorized:
      $ref: "./swagger/components/responses.yaml#/Unauthorized"