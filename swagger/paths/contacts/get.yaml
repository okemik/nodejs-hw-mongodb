tags:
  - Contacts
summary: Retrieve a list of contacts
operationId: getContacts
description: Returns a list of contacts. Supports optional pagination and filtering.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      minimum: 1
  - name: limit
    in: query
    description: Number of items per page
    required: false
    schema:
      type: integer
      minimum: 1
  - name: search
    in: query
    description: Search term to filter contacts by name or email
    required: false
    schema:
      type: string
responses:
  "200":
    description: Contact found
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Contact"
  "404":
    $ref: "#/components/responses/NotFound"
  "401":
    $ref: "#/components/responses/Unauthorized"