tags:
  - Contacts
summary: Retrieve a single contact by ID
operationId: getContactById
description: Gets contact details by contact ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: The id of the contact
responses:
  "200":
    description: Contact found
    content:
      application/json:
        schema:
          $ref: "../../../../docs/openapi.yaml#/components/schemas/Contact"
  "404":
    description: Contact not found
  "401":
    description: Unauthorized
