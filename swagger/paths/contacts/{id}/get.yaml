tags:
  - Contacts
summary: Retrieve a single contact by ID
operationId: getContactById
description: Gets contact details by contact ID.
security:
  - bearerAuth: []
parameters:
  - name: id        # openapi.yaml’daki path parametre ismi ile aynı olmalı
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: The id of the contact
responses:
  "200":
    description: Contact found
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Contact"
  "404":
    $ref: "#/components/responses.yaml#/NotFound"
  "401":
    $ref: "#/components/responses.yaml#/Unauthorized"
