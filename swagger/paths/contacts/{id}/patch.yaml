tags:
  - Contacts
summary: Update an existing contact
operationId: updateContact
description: Updates contact information partially.
security:
  - bearerAuth: []
parameters:
  - $ref: "../../../components/parameters.yaml#/ContactId"
requestBody:
  description: Fields to update for the contact
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phone:
            type: string
responses:
  "200":
    description: Contact found
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Contact"
  "404":
    $ref: "#/components/responses.yaml#/NotFound"
  "401":
    $ref: "#/components/responses.yaml#/Unauthorized"
