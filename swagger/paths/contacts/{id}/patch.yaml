tags:
  - Contacts
summary: Update an existing contact
operationId: updateContact
description: Updates contact information partially.
security:
  - bearerAuth: []
parameters:
  - $ref: "../../../openapi.yaml#/components/parameters/id"
requestBody:
  description: Fields to update for the contact
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phone:
            type: string
responses:
  "200":
    content:
      application/json:
        schema:
          $ref: "../../../openapi.yaml#/components/schemas/Contact"
  "404":
    $ref: "../../../openapi.yaml#/components/responses/NotFound"
  "401":
    $ref: "../../../openapi.yaml#/components/responses/Unauthorized"