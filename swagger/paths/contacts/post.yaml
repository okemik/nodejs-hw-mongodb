tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Adds a new contact to the system.
security:
  - bearerAuth: []
requestBody:
  description: Contact object that needs to be added
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "Jane Smith"
          email:
            type: string
            format: email
            example: "jane@example.com"
          phone:
            type: string
            example: "+19876543210"
        required:
          - name
          - email
responses:
  "201":
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: "../../../../docs/openapi.yaml#/components/schemas/Contact"
  "401":
    description: Unauthorized
