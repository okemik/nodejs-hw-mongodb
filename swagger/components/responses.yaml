NotFound:
  description: The specified resource was not found.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: "Contact not found"

Unauthorized:
  description: Unauthorized access
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: "Unauthorized"
